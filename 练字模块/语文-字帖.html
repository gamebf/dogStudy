<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>三年级上册 · 语文字帖</title>
<style>

@page { size: A4; margin: 12mm; }
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body { font-family: "KaiTi","STKaiti","楷体","SimSun",serif; color:#222; }
.sheet { width:186mm; margin:0 auto; }
h1 { text-align:center; font-size:20px; margin:3px 0 0; }
.sub { text-align:center; color:#888; font-size:11px; margin-bottom:4px; }
.controls { text-align:center; margin:4px 0 8px; font-size:15px; }
.controls button { font-size:15px; padding:4px 14px; margin:0 4px; cursor:pointer; }
.controls input { width:48px; font-size:15px; text-align:center; }
.day-title { font-size:17px; border-bottom:2px solid; padding-bottom:3px; margin:4px 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
.day-title .meta { font-size:12px; color:#666; font-weight:normal; }
.label { font-size:13px; color:#555; margin:10px 0 3px; }
.ref { font-size:22px; color:#c33; margin:0 0 3px; }
.ref-sent { font-size:19px; color:#c33; margin:0 0 3px; }
@media print { .no-print { display:none; } }

.day-title { border-color: #c33; }

.hz-wrap { display:flex; flex-wrap:wrap; justify-content:space-between; }
.hz-block { flex:0 0 48%; margin:0 0 8px 0; }
.hz-row { display:flex; align-items:flex-end; }
.hz-row.free { justify-content:center; }
.hz-cell { display:flex; flex-direction:column; align-items:center; margin:0 1px; }
.hz-cell .py { width:52px; height:28px; position:relative; display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px; margin-bottom:6px; font-family:"Arial","Segoe UI",sans-serif; }
.hz-cell .py .pyt { position:relative; z-index:1; font-size:14px; line-height:1; }
.hz-cell .py .l { position:absolute; left:0; right:0; height:0; }
.hz-cell .py .l1 { top:20%; border-top:1px solid #f66; }
.hz-cell .py .l2 { top:46%; border-top:1px dashed #222; }
.hz-cell .py .l3 { top:74%; border-top:1px dashed #222; }
.hz-cell .py .l4 { top:96%; border-top:1px solid #f66; }
.hz-cell .py.fan .pyt { color:#d00; }
.hz-cell .py.trace .pyt { color:#d8d8d8; }
.hz-cell .tian { width:52px; height:52px; position:relative; border:1px solid #555; display:flex; align-items:center; justify-content:center; }
.hz-cell .tian::before { content:""; position:absolute; left:0; right:0; top:50%; border-top:1px dashed #bbb; }
.hz-cell .tian::after { content:""; position:absolute; top:0; bottom:0; left:50%; border-left:1px dashed #bbb; }
.hz-cell .tian .c { font-size:36px; line-height:1; position:relative; z-index:1; }
.hz-cell .tian .c.fan { color:#d00; }
.hz-cell .tian .c.trace { color:#d0d0d0; }
.hz-cell .tian .hw { width:50px; height:50px; position:relative; z-index:1; cursor:pointer; }
.stroke-order { display:flex; flex-wrap:wrap; align-items:flex-end; gap:2px; margin-top:2px; }
.stroke-order .so-step { width:30px; height:30px; position:relative; display:flex; align-items:center; justify-content:center; }
.stroke-order .so-step svg { width:30px; height:30px; }
.stroke-order path { stroke:none; }
.stroke-order .so-done { fill:#d88; }
.word-practice { display:flex; align-items:flex-start; }
.word-group { display:flex; flex:0 0 50%; min-width:0; }
.word-group .hz-cell { flex:0 0 52px; }
.stroke-order .so-step-no { position:absolute; right:-1px; bottom:-3px; font:10px Arial,sans-serif; color:#888; }
.stroke-order .so-count { font-size:12px; color:#888; margin-left:4px; }
.word-line { margin:0 0 6px 0; }
.gap { width:16px; }
@media print { .hz-cell .tian { border-color:#999; } }

</style>
</head>
<body>
<div class="sheet">
<h1>三年级上册 · 语文字帖</h1>
<div class="sub">统编版（部编版）语文 · 田字格 + 拼音 + 笔顺（点击范字看动画）</div>
<div class="no-print controls">
  <button onclick="goto(0)">◀ 上一天</button>
  <span>第 <input id="dayInp" type="number" min="1" max="68" value="1" onchange="jump()"> / 68 天</span>
  <button onclick="goto(1)">下一天 ▶</button>
  <button onclick="window.print()">🖨 打印本页</button>
</div>
<div id="app"></div>
</div>

var cur = 0;
var render = function cnRender(day) {
  function hzCell(c, py, cls, anim, nopy) {
    let p = nopy ? '' : `<div class="py ${cls}"><span class="pyt">${py}</span><span class="l l1"></span><span class="l l2"></span><span class="l l3"></span><span class="l l4"></span></div>`;
    let t;
    if (anim) t = `<div class="hw" data-c="${c}"></div>`;
    else if (c) t = `<span class="c ${cls}">${c}</span>`;
    else t = '';
    return `<div class="hz-cell">${p}<div class="tian ${cls}">${t}</div></div>`;
  }
  function strokeOrder(c) {
    const d = (typeof HANZI_DATA !== 'undefined' && HANZI_DATA[c]) || null;
    if (!d || !d.strokes || !d.strokes.length) return '';
    const n = d.strokes.length;
    let s = '<div class="stroke-order">';
    for (let k = 1; k <= n; k++) {
      s += '<div class="so-step"><svg viewBox="-20 -20 1064 1064"><g transform="translate(0,1024) scale(1,-1)">';
      for (let i = 0; i < k; i++) s += '<path d="' + d.strokes[i] + '" class="so-done"/>';
      s += '</g></svg><span class="so-step-no">' + k + '</span></div>';
    }
    s += '<span class="so-count">共' + n + '画</span></div>';
    return s;
  }
  let h = '';
  h += `<div class="day-title"><span>第 ${day.day} 天${day.lesson ? ' · ' + day.lesson : ''}${day.review ? '（复习）' : ''}</span><span class="meta">姓名：________　日期：____年__月__日</span></div>`;
  h += `<div class="label">◆ 生字（点击红色范字看笔顺动画，先描红再临写）</div>`;
  h += `<div class="hz-wrap">`;
  day.chars.forEach(it => {
    h += `<div class="hz-block"><div class="hz-row">`;
    h += hzCell(it.c, it.py, 'fan', true);
    h += hzCell(it.c, it.py, 'trace', false);
    h += hzCell(it.c, it.py, 'trace', false);
    h += hzCell(it.c, it.py, 'trace', false);
    h += hzCell(it.c, it.py, 'trace', false);
    h += hzCell(it.c, it.py, 'trace', false);
    h += `</div>${strokeOrder(it.c)}</div>`;
  });
  h += `</div>`;
  h += `<div class="label">◆ 自由练习（每行一个生字，照范字临写）</div>`;
  day.chars.forEach(it => {
    h += `<div class="hz-row free">`;
    h += hzCell(it.c, it.py, 'fan', false);
    for (let i = 0; i < 11; i++) h += hzCell('', '', 'blank', false);
    h += `</div>`;
  });
  h += `<div class="label">◆ 组词描红（文字 + 拼音）</div>`;
  const practiceWords = day.practiceWords || [];
  for (let row = 0; row < 2; row++) {
    h += `<div class="hz-row free word-practice">`;
    const pair = practiceWords.slice(row * 2, row * 2 + 2);
    pair.forEach(item => {
      const word = item.text;
      const chars = Array.from(word);
      const pys = item.pys || [];
      h += `<span class="word-group">`;
      chars.forEach((ch, i) => h += hzCell(ch, pys[i] || '', 'trace', false));
      for (let i = chars.length; i < 6; i++) h += hzCell('', '', 'blank', false);
      h += `</span>`;
    });
    h += `</div>`;
  }
  return h;
};
function show() {
  document.getElementById('app').innerHTML = render(DAYS[cur]);
  document.getElementById('dayInp').value = cur + 1;
  document.querySelectorAll('.hw').forEach(function(el){ var c = el.getAttribute('data-c'); if(!HANZI_DATA[c]) return; try { var w = HanziWriter.create(el, c, { width:50, height:50, padding:3, showOutline:false, strokeColor:'#d33', charDataLoader:function(ch, done){ done(HANZI_DATA[ch]); } }); el.addEventListener('click', function(){ w.animateCharacter(); }); } catch(e){} });
}
function goto(dir) { cur = Math.min(67, Math.max(0, cur + (dir ? 1 : -1))); show(); }
function jump() { var v = parseInt(document.getElementById('dayInp').value, 10); if (!isNaN(v)) { cur = Math.min(67, Math.max(0, v - 1)); show(); } }
show();
</script>
