<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>三年级上册 · 数学字帖</title>
<style>

@page { size: A4; margin: 12mm; }
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body { font-family: "KaiTi","STKaiti","楷体","SimSun",serif; color:#222; }
.sheet { width:186mm; margin:0 auto; }
h1 { text-align:center; font-size:20px; margin:3px 0 0; }
.sub { text-align:center; color:#888; font-size:11px; margin-bottom:4px; }
.controls { text-align:center; margin:4px 0 8px; font-size:15px; }
.controls button { font-size:15px; padding:4px 14px; margin:0 4px; cursor:pointer; }
.controls input { width:48px; font-size:15px; text-align:center; }
.day-title { font-size:17px; border-bottom:2px solid; padding-bottom:3px; margin:4px 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
.day-title .meta { font-size:12px; color:#666; font-weight:normal; }
.label { font-size:13px; color:#555; margin:10px 0 3px; }
.ref { font-size:22px; color:#c33; margin:0 0 3px; }
.ref-sent { font-size:19px; color:#c33; margin:0 0 3px; }
@media print { .no-print { display:none; } }

.day-title { border-color: #2a6; }

.box { width:52px; height:52px; margin:2px; border:1px solid #555; position:relative; display:flex; align-items:center; justify-content:center; font-size:36px; }
.box .c { position:relative; z-index:1; line-height:1; }
.box.fan .c { color:#d00; }
.box.trace .c { color:#d0d0d0; }
.box.blank .c { color:transparent; }
.eq { font-size:26px; align-self:center; margin:0 3px; }
.sp { width:14px; }
.row { display:flex; flex-wrap:wrap; align-items:flex-end; margin:0 0 8px 0; }
.row.free { justify-content:center; }

</style>
</head>
<body>
<div class="sheet">
<h1>三年级上册 · 数学字帖</h1>
<div class="sub">沪教版数学 · 数字与数学用语（每日 1 页）</div>
<div class="no-print controls">
  <button onclick="goto(0)">◀ 上一天</button>
  <span>第 <input id="dayInp" type="number" min="1" max="60" value="1" onchange="jump()"> / 60 天</span>
  <button onclick="goto(1)">下一天 ▶</button>
  <button onclick="window.print()">🖨 打印本页</button>
</div>
<div id="app"></div>
</div>
<script>

var DAYS = [{"day":1,"review":false,"kind":"nums","nums":[0,1,2,3,4]},{"day":2,"review":false,"kind":"nums","nums":[5,6,7,8,9]},{"day":3,"review":false,"kind":"nums","nums":[10,11,12,13,14]},{"day":4,"review":false,"kind":"nums","nums":[15,16,17,18,19,20]},{"day":5,"review":false,"kind":"nums","nums":[30,40,50,60,70]},{"day":6,"review":false,"kind":"nums","nums":[80,90,100,200,500]},{"day":7,"review":false,"kind":"eq","data":["36 + 24 = 60"]},{"day":8,"review":false,"kind":"eq","data":["58 - 19 = 39"]},{"day":9,"review":false,"kind":"eq","data":["24 × 3 = 72"]},{"day":10,"review":false,"kind":"eq","data":["96 ÷ 4 = 24"]},{"day":11,"review":false,"kind":"eq","data":["7 × 8 = 56"]},{"day":12,"review":false,"kind":"eq","data":["100 - 37 = 63"]},{"day":13,"review":false,"kind":"terms","chars":"加减乘除等于"},{"day":14,"review":false,"kind":"terms","chars":"和差积商"},{"day":15,"review":false,"kind":"terms","chars":"时分秒"},{"day":16,"review":false,"kind":"terms","chars":"千米米分米厘米毫米"},{"day":17,"review":false,"kind":"terms","chars":"千克克吨"},{"day":18,"review":false,"kind":"terms","chars":"倍"},{"day":19,"review":false,"kind":"terms","chars":"长方形正方形"},{"day":20,"review":false,"kind":"terms","chars":"周长边长"},{"day":21,"review":false,"kind":"terms","chars":"直角锐角钝角"},{"day":22,"review":false,"kind":"terms","chars":"三角形"},{"day":23,"review":false,"kind":"terms","chars":"年月日"},{"day":24,"review":false,"kind":"terms","chars":"上下左右前后"},{"day":25,"review":false,"kind":"terms","chars":"东南西北"},{"day":26,"review":true,"kind":"nums","nums":[0,1,2,3,4]},{"day":27,"review":true,"kind":"nums","nums":[5,6,7,8,9]},{"day":28,"review":true,"kind":"nums","nums":[10,11,12,13,14]},{"day":29,"review":true,"kind":"nums","nums":[15,16,17,18,19,20]},{"day":30,"review":true,"kind":"nums","nums":[30,40,50,60,70]},{"day":31,"review":true,"kind":"nums","nums":[80,90,100,200,500]},{"day":32,"review":true,"kind":"eq","data":["36 + 24 = 60"]},{"day":33,"review":true,"kind":"eq","data":["58 - 19 = 39"]},{"day":34,"review":true,"kind":"eq","data":["24 × 3 = 72"]},{"day":35,"review":true,"kind":"eq","data":["96 ÷ 4 = 24"]},{"day":36,"review":true,"kind":"eq","data":["7 × 8 = 56"]},{"day":37,"review":true,"kind":"eq","data":["100 - 37 = 63"]},{"day":38,"review":true,"kind":"terms","chars":"加减乘除等于"},{"day":39,"review":true,"kind":"terms","chars":"和差积商"},{"day":40,"review":true,"kind":"terms","chars":"时分秒"},{"day":41,"review":true,"kind":"terms","chars":"千米米分米厘米毫米"},{"day":42,"review":true,"kind":"terms","chars":"千克克吨"},{"day":43,"review":true,"kind":"terms","chars":"倍"},{"day":44,"review":true,"kind":"terms","chars":"长方形正方形"},{"day":45,"review":true,"kind":"terms","chars":"周长边长"},{"day":46,"review":true,"kind":"terms","chars":"直角锐角钝角"},{"day":47,"review":true,"kind":"terms","chars":"三角形"},{"day":48,"review":true,"kind":"terms","chars":"年月日"},{"day":49,"review":true,"kind":"terms","chars":"上下左右前后"},{"day":50,"review":true,"kind":"terms","chars":"东南西北"},{"day":51,"review":true,"kind":"nums","nums":[0,1,2,3,4]},{"day":52,"review":true,"kind":"nums","nums":[5,6,7,8,9]},{"day":53,"review":true,"kind":"nums","nums":[10,11,12,13,14]},{"day":54,"review":true,"kind":"nums","nums":[15,16,17,18,19,20]},{"day":55,"review":true,"kind":"nums","nums":[30,40,50,60,70]},{"day":56,"review":true,"kind":"nums","nums":[80,90,100,200,500]},{"day":57,"review":true,"kind":"eq","data":["36 + 24 = 60"]},{"day":58,"review":true,"kind":"eq","data":["58 - 19 = 39"]},{"day":59,"review":true,"kind":"eq","data":["24 × 3 = 72"]},{"day":60,"review":true,"kind":"eq","data":["96 ÷ 4 = 24"]}];
var cur = 0;
var render = function mathRender(day) {
  function box(txt, cls) { return `<span class="box ${cls}"><span class="c">${txt}</span></span>`; }
  let h = `<div class="day-title"><span>第 ${day.day} 天 · 数学${day.review ? '（复习）' : ''}</span><span class="meta">姓名：________　日期：____年__月__日</span></div>`;
  if (day.kind === 'nums') {
    h += `<div class="label">◆ 数字书写（红字 + 描红 + 空格）</div>`;
    day.nums.forEach(n => {
      const s = String(n);
      h += `<div class="row">`;
      for (const ch of s) h += box(ch, 'fan');
      for (const ch of s) h += box(ch, 'trace');
      for (let i = 0; i < 6; i++) h += box('', 'blank');
      h += `</div>`;
    });
  } else if (day.kind === 'eq') {
    h += `<div class="label">◆ 算式（先描红，再对位抄写）</div>`;
    day.data.forEach(e => {
      h += `<div class="row">`;
      for (const ch of e) {
        if (ch === ' ') { h += `<span class="sp"></span>`; continue; }
        if (/[0-9]/.test(ch)) h += box(ch, 'trace'); else h += `<span class="eq">${ch}</span>`;
      }
      h += `</div>`;
      for (let r = 0; r < 4; r++) {
        h += `<div class="row">`;
        for (const ch of e) {
          if (ch === ' ') { h += `<span class="sp"></span>`; continue; }
          if (/[0-9]/.test(ch)) h += box('', 'blank'); else h += `<span class="eq">${ch}</span>`;
        }
        h += `</div>`;
      }
    });
  } else if (day.kind === 'terms') {
    h += `<div class="label">◆ 数学用语（会认会写）</div><div class="row">`;
    for (const c of day.chars) {
      h += box(c, 'fan') + box(c, 'trace');
      for (let i = 0; i < 6; i++) h += box('', 'blank');
    }
    h += `</div>`;
  }
  h += `<div class="label">◆ 自由练习（空白方格）</div>`;
  for (let r = 0; r < 6; r++) {
    h += `<div class="row free">`;
    for (let i = 0; i < 12; i++) h += box('', 'blank');
    h += `</div>`;
  }
  return h;
};
function show() {
  document.getElementById('app').innerHTML = render(DAYS[cur]);
  document.getElementById('dayInp').value = cur + 1;
  
}
function goto(dir) { cur = Math.min(59, Math.max(0, cur + (dir ? 1 : -1))); show(); }
function jump() { var v = parseInt(document.getElementById('dayInp').value, 10); if (!isNaN(v)) { cur = Math.min(59, Math.max(0, v - 1)); show(); } }
show();
</script>
</body>
</html>
